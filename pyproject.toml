[project]
name = "nanojepa"
version = "0.1.0"
description = "Joint-Embedding Predictive Architecture for text - latent space reasoning"
readme = "CLAUDE.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0",
    "tiktoken>=0.5",
    "tqdm>=4.65",
]

[project.scripts]
train = "nanojepa.train:main"

[tool.uv]
dev-dependencies = [
    "pytest>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nanojepa"]
